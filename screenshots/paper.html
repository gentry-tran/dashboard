<!DOCTYPE html>
<html>
<head><style>
  body { background: transparent; margin: 0; padding: 8px; }
  .window { background: #ffffff; border-radius: 10px; overflow: hidden; display: inline-block; box-shadow: 0 4px 20px rgba(60,64,67,0.20); }
  .titlebar { background: #e8eaed; padding: 8px 12px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #ea4335; }
  .dot-yellow { background: #fbbc04; }
  .dot-green { background: #34a853; }
  .content { padding: 14px 18px; font-family: 'JetBrains Mono','Fira Code','SF Mono','Menlo',monospace; font-size: 13px; line-height: 1.6; }
  pre { margin: 0; white-space: pre; }
</style></head>
<body>
  <div class="window">
    <div class="titlebar"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
    <div class="content"><pre></pre></div>
  </div>
</body>
</html>
